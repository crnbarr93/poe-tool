# CI - FAST FEEDBACK
# ==================
# Runs on every push and pull request to main. This is the cheap gate: it proves
# the TypeScript compiles under strict settings and that the unit suite is green.
# It deliberately does NOT run electron-builder - packaging is slow, only matters
# for a release, and lives in release.yml.
#
# WHY THIS RUNS ON WINDOWS TOO
# ----------------------------
# This file used to run on ubuntu-latest alone, arguing that the suite was
# "platform independent BY CONSTRUCTION, not by luck". The first windows-latest
# run disproved it in one shot: test/log-reader.test.ts asserted that pointing the
# reader at a DIRECTORY yields `read-error`, which held on POSIX (the read raises
# EISDIR) but not on Windows, where `open` on a directory SUCCEEDS and reports
# size 0. The reader answered `ok` and would have tailed nothing forever behind a
# healthy status badge.
#
# That bug was only catchable on a Windows runner, and before this matrix the only
# Windows runner in the repo was in release.yml - i.e. it could not be caught
# until release time, which is the worst moment to discover it. The app ships for
# Windows exclusively, so Windows is the platform that actually matters and it now
# gates every PR.
#
# ubuntu is kept in the matrix because it is the fastest tier and catches
# POSIX-only regressions in the dev loop (the maintainer works on macOS, which is
# closer to ubuntu than to the shipping target).
#
# Still no electron-builder here - packaging is slow, only matters for a release,
# and lives in release.yml.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege. CI only ever needs to read the repository; it never creates a
# release, pushes a tag, or comments. The elevated `contents: write` permission
# that publishing requires is scoped to release.yml alone.
permissions:
  contents: read

# A newer commit on the same branch or PR makes an in-flight run obsolete, so
# cancel it rather than paying for a result nobody will read.
#
# NOTE: release.yml deliberately does NOT set this. Cancelling a half-finished
# publish could leave a GitHub Release with only some of its assets uploaded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      # Never cancel the Windows leg because the ubuntu leg went red (or vice
      # versa). When a failure IS platform specific, seeing both results is the
      # whole diagnostic - that contrast is what identified the directory-open
      # split described in the header.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # Caches the npm download cache, keyed off package-lock.json. This is
          # safe to enable because a lockfile is committed; without one the
          # action fails outright rather than silently skipping the cache.
          cache: npm

      # `npm ci` (not `npm install`) so the lockfile is authoritative and CI can
      # never silently drift onto a newer transitive dependency than the one that
      # was reviewed. It also wipes node_modules first, so the run is reproducible.
      - name: Install dependencies
        run: npm ci

      # Covers all three project references in one shot: main, renderer and test
      # (see the "typecheck" script in package.json). Strict mode is enforced by
      # the tsconfigs, so this is what actually holds the line on "no any".
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
