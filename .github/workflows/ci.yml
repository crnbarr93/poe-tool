# CI - FAST FEEDBACK
# ==================
# Runs on every push and pull request to main. This is the cheap gate: it proves
# the TypeScript compiles under strict settings and that the unit suite is green.
# It deliberately does NOT run electron-builder - packaging is slow, only matters
# for a release, and lives in release.yml.
#
# WHY ubuntu-latest AND NOT windows-latest
# ----------------------------------------
# poe-tool only ever *ships* for Windows, but nothing these two checks do is
# Windows specific, and ubuntu runners are the fastest and cheapest tier:
#   - `npm run typecheck` is pure tsc: no OS-dependent behaviour.
#   - `npm test` is pure Node under vitest: no Electron binary is launched, no
#     window is opened, no display server is needed.
# The suite is platform independent BY CONSTRUCTION, not by luck. The tests that
# reason about Windows paths (test/default-paths.test.ts, test/clip-namer.test.ts)
# assert against `path.win32` explicitly and build their environment from
# hand-written objects instead of reading the real `process.env`, precisely so the
# same assertions hold on a non-Windows machine. See the header comments in those
# files before assuming a failure here is an "it only breaks on Linux" problem.
#
# The real Windows packaging path is still exercised - on a native windows-latest
# runner in release.yml - so nothing Windows specific escapes CI entirely.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege. CI only ever needs to read the repository; it never creates a
# release, pushes a tag, or comments. The elevated `contents: write` permission
# that publishing requires is scoped to release.yml alone.
permissions:
  contents: read

# A newer commit on the same branch or PR makes an in-flight run obsolete, so
# cancel it rather than paying for a result nobody will read.
#
# NOTE: release.yml deliberately does NOT set this. Cancelling a half-finished
# publish could leave a GitHub Release with only some of its assets uploaded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # Caches the npm download cache, keyed off package-lock.json. This is
          # safe to enable because a lockfile is committed; without one the
          # action fails outright rather than silently skipping the cache.
          cache: npm

      # `npm ci` (not `npm install`) so the lockfile is authoritative and CI can
      # never silently drift onto a newer transitive dependency than the one that
      # was reviewed. It also wipes node_modules first, so the run is reproducible.
      - name: Install dependencies
        run: npm ci

      # Covers all three project references in one shot: main, renderer and test
      # (see the "typecheck" script in package.json). Strict mode is enforced by
      # the tsconfigs, so this is what actually holds the line on "no any".
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
